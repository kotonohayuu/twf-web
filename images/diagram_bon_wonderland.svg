<svg xmlns="http://www.w3.org/2000/svg" width="400" height="282" viewBox="0 0 400 282" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>現実世界とWonderlandのつながり</title>
<desc>上段の現実世界と下段の白い空間Wonderlandの2層で構成。現実世界にはボン（機体）とスーザン・ローズマリー等、Wonderlandには「Bon」（灰色の存在）とエド＆モリーが並ぶ。左列ではWonderlandの「Bon」から現実のボン（機体）へ「憑依・干渉」の上向き矢印が、右列では現実のスーザン・ローズマリー等からWonderlandへ「魂が移る」の下向き矢印が伸びている。</desc>
<rect x="0" y="0" width="400" height="282" rx="8" fill="#0e131e" stroke="none"/>
<rect x="12" y="12" width="376" height="98" rx="8" fill="#151922" stroke="#566178" stroke-width="1.4"/>
<text x="26" y="37" font-size="14" fill="#9db7ff" font-weight="700" text-anchor="start">現実世界（店舗・警察署・ウォルテン家）</text>
<rect x="18" y="50" width="178" height="48" rx="6" fill="#0e131e" stroke="#c9a4ff" stroke-width="1.3"/>
<text x="107" y="79.5" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ボン（機体）</text>
<rect x="204" y="50" width="178" height="48" rx="6" fill="#0e131e" stroke="#fca5a5" stroke-width="1.3"/>
<text x="293" y="78.5" font-size="12.5" fill="#e8edf7" font-weight="700" text-anchor="middle">スーザン・ローズマリー等</text>
<line x1="107" y1="170" x2="107" y2="120" stroke="#c9a4ff" stroke-width="2"/><polygon points="107,112 102,121 112,121" fill="#c9a4ff"/>
<text x="119" y="146" font-size="13.5" fill="#c9a4ff" font-weight="700" text-anchor="start">憑依・干渉</text>
<line x1="293" y1="112" x2="293" y2="162" stroke="#fca5a5" stroke-width="2"/><polygon points="293,170 288,161 298,161" fill="#fca5a5"/>
<text x="281" y="146" font-size="13.5" fill="#fca5a5" font-weight="700" text-anchor="end">魂が移る</text>
<rect x="12" y="172" width="376" height="98" rx="8" fill="#1a1726" stroke="#c9a4ff" stroke-width="1.4"/>
<text x="26" y="197" font-size="14" fill="#c9a4ff" font-weight="700" text-anchor="start">Wonderland（真っ白な空間）</text>
<rect x="18" y="210" width="178" height="48" rx="6" fill="#0e131e" stroke="#fca5a5" stroke-width="1.3"/>
<text x="107" y="239.5" font-size="14" fill="#fca5a5" font-weight="700" text-anchor="middle">「Bon」（灰色の存在）</text>
<rect x="204" y="210" width="178" height="48" rx="6" fill="#0e131e" stroke="#68d7ff" stroke-width="1.3"/>
<text x="293" y="239.5" font-size="15" fill="#68d7ff" font-weight="700" text-anchor="middle">エド＆モリー</text>
</svg>
