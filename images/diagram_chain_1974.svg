<svg xmlns="http://www.w3.org/2000/svg" width="400" height="452" viewBox="0 0 400 452" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>1974年5月〜7月の主な出来事</title>
<desc>1974年5月2日の飲酒事故から、虚偽の説明と告訴見送り、Rocketの異変、ジャック失踪、開店、スーザン・チャールズ・ローズマリーの被害と閉業、7月26日の警察聴取までを日付順に並べた図。</desc>
<rect x="0" y="0" width="400" height="452" rx="8" fill="#0e131e" stroke="none"/>
<text x="14" y="24" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年5月〜7月（日付順）</text>
<line x1="94" y1="52" x2="94" y2="404" stroke="#30384a" stroke-width="2"/>
<text x="80" y="56.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">05/02 夜</text>
<circle cx="94" cy="52" r="5" fill="#fca5a5"/>
<text x="112" y="57" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">飲酒事故・エド＆モリー遺体隠蔽</text>
<text x="80" y="100.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">05/03–05</text>
<circle cx="94" cy="96" r="5" fill="#68d7ff"/>
<text x="112" y="101" font-size="14.5" fill="#e8edf7" font-weight="400" text-anchor="start">フェリックス虚偽説明・ジャック告訴せず</text>
<text x="80" y="144.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">05/13</text>
<circle cx="94" cy="140" r="5" fill="#68d7ff"/>
<text x="112" y="145" font-size="14.5" fill="#e8edf7" font-weight="400" text-anchor="start">Rocket が店舗の舞台裏で動き出す</text>
<text x="80" y="188.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">06/11–13</text>
<circle cx="94" cy="184" r="5" fill="#fca5a5"/>
<text x="112" y="189" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">ジャック失踪・2日後に最後の電話</text>
<text x="80" y="232.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">06/28</text>
<circle cx="94" cy="228" r="5" fill="#68d7ff"/>
<text x="112" y="233" font-size="14.5" fill="#e8edf7" font-weight="400" text-anchor="start">Bon's Burgers 開店（ジャック不在）</text>
<text x="80" y="276.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">06/30</text>
<circle cx="94" cy="272" r="5" fill="#fca5a5"/>
<text x="112" y="277" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">スーザン襲撃（バニーへ）</text>
<text x="80" y="320.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">07/14</text>
<circle cx="94" cy="316" r="5" fill="#fca5a5"/>
<text x="112" y="321" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">チャールズ失踪（ブーズー示唆）</text>
<text x="80" y="364.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">07/19–20</text>
<circle cx="94" cy="360" r="5" fill="#fca5a5"/>
<text x="112" y="365" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">ローズマリー殺害（シャへ）・閉業</text>
<text x="80" y="408.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">07/26</text>
<circle cx="94" cy="404" r="5" fill="#68d7ff"/>
<text x="112" y="409" font-size="14.5" fill="#e8edf7" font-weight="400" text-anchor="start">フェリックス聴取（逮捕されず退席）</text>
<circle cx="24" cy="434" r="4.5" fill="#fca5a5"/>
<text x="35" y="438" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">死亡・襲撃・失踪</text>
<circle cx="164" cy="434" r="4.5" fill="#68d7ff"/>
<text x="175" y="438" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">その他の節目</text>
</svg>
