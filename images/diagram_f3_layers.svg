<svg xmlns="http://www.w3.org/2000/svg" width="400" height="298" viewBox="0 0 400 298" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>ファイル3の三層構造</title>
<desc>外側から、第1層はアンソニーのテープ、第2層は1982年のホテルの地下室（ソフィー22歳とジェニー26歳）、第3層はゲーム「BunnyFarm」（スーザンの音声ログ、リンダの日記、失踪者の顔）。第3層から「グリッチ・語りかけ」の矢印が第2層の「ソフィーの記憶」へ伸びている。</desc>
<rect x="0" y="0" width="400" height="298" rx="8" fill="#0e131e" stroke="none"/>
<rect x="8" y="8" width="384" height="282" rx="8" fill="#151922" stroke="#566178" stroke-width="1.5"/>
<text x="22" y="34" font-size="13" fill="#aeb7c8" font-weight="700" text-anchor="start">第1層</text>
<text x="64" y="35" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">アンソニーのテープ</text>
<rect x="24" y="52" width="352" height="224" rx="8" fill="#202636" stroke="#9db7ff" stroke-width="1.5"/>
<text x="38" y="78" font-size="13" fill="#9db7ff" font-weight="700" text-anchor="start">第2層</text>
<text x="80" y="79" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">1982年・ホテルの地下室</text>
<text x="38" y="101" font-size="13.5" fill="#aeb7c8" font-weight="400" text-anchor="start">ソフィー（22）／ジェニー（26）</text>
<rect x="40" y="116" width="320" height="66" rx="8" fill="#0e131e" stroke="#68d7ff" stroke-width="1.5"/>
<text x="54" y="142" font-size="13" fill="#68d7ff" font-weight="700" text-anchor="start">第3層</text>
<text x="96" y="143" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">ゲーム「BunnyFarm」</text>
<text x="54" y="166" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">スーザンの音声ログ／リンダの日記／失踪者の顔</text>
<line x1="120" y1="184" x2="120" y2="211" stroke="#fcd34d" stroke-width="2"/><polygon points="120,218 115,209 125,209" fill="#fcd34d"/>
<text x="134" y="206" font-size="13" fill="#fcd34d" font-weight="700" text-anchor="start">グリッチ・語りかけ</text>
<rect x="56" y="222" width="288" height="42" rx="6" fill="#0e131e" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="200" y="248.5" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ソフィーの記憶</text>
</svg>
