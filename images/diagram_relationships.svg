<svg xmlns="http://www.w3.org/2000/svg" width="400" height="464" viewBox="0 0 400 464" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>主要人物のつながり</title>
<desc>ウォルテン家と親族（ジャック・ローズマリー・ソフィー・エド＆モリー・ローラ）、BSI（フェリックスと社員・管理人）、ブライトン市警および1982年以降の関係者を3つの帯で整理した図。</desc>
<rect x="0" y="0" width="400" height="464" rx="8" fill="#0e131e" stroke="none"/>
<rect x="12" y="16" width="4" height="16" rx="2" fill="#9db7ff"/>
<text x="24" y="29" font-size="13.5" fill="#9db7ff" font-weight="700" text-anchor="start">ウォルテン家と親族</text>
<rect x="12" y="42" width="166" height="48" rx="6" fill="#151922" stroke="#9db7ff" stroke-width="1.2"/>
<text x="95" y="63" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ジャック</text>
<text x="95" y="81" font-size="12" fill="#aeb7c8" font-weight="400" text-anchor="middle">父・共同創業者</text>
<line x1="178" y1="66" x2="222" y2="66" stroke="#9db7ff" stroke-width="1.5"/>
<text x="200" y="60" font-size="11.5" fill="#9db7ff" font-weight="400" text-anchor="middle">夫婦</text>
<rect x="222" y="42" width="166" height="48" rx="6" fill="#151922" stroke="#fca5a5" stroke-width="1.2"/>
<text x="305" y="63" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ローズマリー</text>
<text x="305" y="81" font-size="12" fill="#aeb7c8" font-weight="400" text-anchor="middle">母・設計担当</text>
<line x1="200" y1="66" x2="200" y2="106" stroke="#566178" stroke-width="1.5"/>
<line x1="74" y1="106" x2="203" y2="106" stroke="#566178" stroke-width="1.5"/>
<line x1="74" y1="106" x2="74" y2="118" stroke="#566178" stroke-width="1.5"/>
<line x1="203" y1="106" x2="203" y2="118" stroke="#566178" stroke-width="1.5"/>
<line x1="330" y1="90" x2="330" y2="118" stroke="#fca5a5" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="348" y="109" font-size="11" fill="#fca5a5" font-weight="400" text-anchor="middle">姉妹</text>
<rect x="12" y="118" width="124" height="52" rx="6" fill="#151922" stroke="#68d7ff" stroke-width="1.2"/>
<text x="74" y="140" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="middle">ソフィー</text>
<text x="74" y="159" font-size="12" fill="#68d7ff" font-weight="400" text-anchor="middle">長女（生還）</text>
<rect x="144" y="118" width="118" height="52" rx="6" fill="#151922" stroke="#c9a4ff" stroke-width="1.2"/>
<text x="203" y="140" font-size="14" fill="#e8edf7" font-weight="700" text-anchor="middle">エド＆モリー</text>
<text x="203" y="159" font-size="11.5" fill="#aeb7c8" font-weight="400" text-anchor="middle">事故死→Rocket</text>
<rect x="270" y="118" width="118" height="52" rx="6" fill="#151922" stroke="#30384a" stroke-width="1.2"/>
<text x="329" y="140" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="middle">ローラ</text>
<text x="329" y="159" font-size="11.5" fill="#aeb7c8" font-weight="400" text-anchor="middle">叔母（引取先）</text>
<rect x="12" y="190" width="4" height="16" rx="2" fill="#fcd34d"/>
<text x="24" y="203" font-size="13.5" fill="#fcd34d" font-weight="700" text-anchor="start">BSI（バニースマイルズ社）</text>
<rect x="12" y="216" width="376" height="52" rx="6" fill="#151922" stroke="#fcd34d" stroke-width="1.2"/>
<text x="24" y="238" font-size="15" fill="#fcd34d" font-weight="700" text-anchor="start">フェリックス・クランケン</text>
<text x="24" y="258" font-size="12.5" fill="#aeb7c8" font-weight="400" text-anchor="start">共同創業者・事故加害者（元パートナー：リンダ）</text>
<rect x="12" y="276" width="376" height="52" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="24" y="298" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">社員・K-9施設の関係者</text>
<text x="24" y="318" font-size="12" fill="#aeb7c8" font-weight="400" text-anchor="start">スーザン／チャールズ／クリス／アシュリー／デビッド等</text>
<rect x="12" y="348" width="4" height="16" rx="2" fill="#68d7ff"/>
<text x="24" y="361" font-size="13.5" fill="#68d7ff" font-weight="700" text-anchor="start">警察と 1982 年以降</text>
<rect x="12" y="374" width="184" height="76" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="24" y="398" font-size="14.5" fill="#68d7ff" font-weight="700" text-anchor="start">ブライトン市警</text>
<text x="24" y="419" font-size="12" fill="#e8edf7" font-weight="400" text-anchor="start">デレク刑事・フランク保安官</text>
<text x="24" y="439" font-size="12" fill="#aeb7c8" font-weight="400" text-anchor="start">失踪事件を捜査</text>
<rect x="204" y="374" width="184" height="76" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="216" y="398" font-size="14.5" fill="#68d7ff" font-weight="700" text-anchor="start">1982年以降</text>
<text x="216" y="419" font-size="12" fill="#e8edf7" font-weight="400" text-anchor="start">ジェニー（ソフィーと同行）</text>
<text x="216" y="439" font-size="12" fill="#aeb7c8" font-weight="400" text-anchor="start">アンソニー（テープ公開者）</text>
</svg>
