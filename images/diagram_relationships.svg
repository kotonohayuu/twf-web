<svg xmlns="http://www.w3.org/2000/svg" width="400" height="564" viewBox="0 0 400 564" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>主要人物のつながり</title>
<desc>ウォルテン家と親族（夫婦のジャック〈1974年6月に失踪〉とローズマリー〈同年7月に殺害されシャの中へ〉、存命の長女ソフィー、事故死して人形Rocketに宿ったエド＆モリー、ローズマリーの姉妹でソフィーを引き取った叔母ローラ）、BSI（共同創業者で事故の加害者フェリックス、1974年当時の社員スーザン・チャールズ・クリス、K-9施設のデビッド・アシュリー・ブライアン）、ブライトン市警（デレク刑事・フランク保安官）と1982年以降の関係者（ソフィーの恋人ジェニー、テープを公開したアンソニー）を3つの帯で整理した図。</desc>
<rect x="0" y="0" width="400" height="564" rx="8" fill="#0e131e" stroke="none"/>
<rect x="12" y="16" width="4" height="16" rx="2" fill="#9db7ff"/>
<text x="24" y="29" font-size="14" fill="#9db7ff" font-weight="700" text-anchor="start">ウォルテン家と親族</text>
<rect x="12" y="42" width="166" height="72" rx="6" fill="#151922" stroke="#9db7ff" stroke-width="1.2"/>
<text x="95" y="64" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ジャック</text>
<text x="95" y="84" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="middle">父・共同創業者</text>
<text x="95" y="103" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="middle">1974年6月 失踪</text>
<line x1="178" y1="78" x2="222" y2="78" stroke="#9db7ff" stroke-width="1.5"/>
<text x="200" y="70" font-size="13" fill="#9db7ff" font-weight="400" text-anchor="middle">夫婦</text>
<rect x="222" y="42" width="166" height="72" rx="6" fill="#151922" stroke="#fca5a5" stroke-width="1.2"/>
<text x="305" y="64" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ローズマリー</text>
<text x="305" y="84" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="middle">母・キャラクター設計</text>
<text x="305" y="103" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="middle">1974年7月 殺害→シャ</text>
<line x1="200" y1="78" x2="200" y2="134" stroke="#566178" stroke-width="1.5"/>
<line x1="74" y1="134" x2="203" y2="134" stroke="#566178" stroke-width="1.5"/>
<line x1="74" y1="134" x2="74" y2="148" stroke="#566178" stroke-width="1.5"/>
<line x1="203" y1="134" x2="203" y2="148" stroke="#566178" stroke-width="1.5"/>
<line x1="329" y1="114" x2="329" y2="148" stroke="#fca5a5" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="337" y="136" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="start">姉妹</text>
<rect x="12" y="148" width="124" height="56" rx="6" fill="#151922" stroke="#68d7ff" stroke-width="1.2"/>
<text x="74" y="171" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ソフィー</text>
<text x="74" y="192" font-size="13" fill="#68d7ff" font-weight="400" text-anchor="middle">長女（存命）</text>
<rect x="144" y="148" width="118" height="56" rx="6" fill="#151922" stroke="#c9a4ff" stroke-width="1.2"/>
<text x="203" y="171" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="middle">エド＆モリー</text>
<text x="203" y="192" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="middle">事故死→Rocket</text>
<rect x="270" y="148" width="118" height="56" rx="6" fill="#151922" stroke="#30384a" stroke-width="1.2"/>
<text x="329" y="171" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="middle">ローラ</text>
<text x="329" y="192" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="middle">叔母（引取先）</text>
<rect x="12" y="224" width="4" height="16" rx="2" fill="#fcd34d"/>
<text x="24" y="237" font-size="14" fill="#fcd34d" font-weight="700" text-anchor="start">BSI（バニースマイルズ社）</text>
<rect x="12" y="250" width="376" height="54" rx="6" fill="#151922" stroke="#fcd34d" stroke-width="1.2"/>
<text x="24" y="273" font-size="15" fill="#fcd34d" font-weight="700" text-anchor="start">フェリックス・クランケン</text>
<text x="24" y="293" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">共同創業者・事故加害者（元パートナー：リンダ）</text>
<rect x="12" y="312" width="376" height="76" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="24" y="335" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">社員・K-9施設の関係者</text>
<text x="24" y="357" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年当時：スーザン／チャールズ／クリス ほか</text>
<text x="24" y="377" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">K-9施設：デビッド／アシュリー／ブライアン ほか</text>
<rect x="12" y="408" width="4" height="16" rx="2" fill="#68d7ff"/>
<text x="24" y="421" font-size="14" fill="#68d7ff" font-weight="700" text-anchor="start">警察・1982年以降の関係者</text>
<rect x="12" y="434" width="376" height="54" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="24" y="457" font-size="14.5" fill="#68d7ff" font-weight="700" text-anchor="start">ブライトン市警</text>
<text x="24" y="477" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">デレク刑事・フランク保安官が失踪事件を捜査</text>
<rect x="12" y="496" width="376" height="54" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/>
<text x="24" y="519" font-size="14.5" fill="#68d7ff" font-weight="700" text-anchor="start">1982年以降</text>
<text x="24" y="539" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">ジェニー（ソフィーの恋人）／アンソニー（テープ公開者）</text>
</svg>
