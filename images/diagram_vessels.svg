<svg xmlns="http://www.w3.org/2000/svg" width="400" height="512" viewBox="0 0 400 512" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>誰がどの機体・人形に入っているか</title>
<desc>スーザンはバニー、チャールズはブーズー（示唆・Wikiの整理のため点線）、ローズマリーはシャ、アシュリーはビリーの中に入れられた。エド＆モリーは人形Rocketに宿り、「Bon」（灰色の存在）は機体ボンに憑依している。ジャック（失踪）とブライアン（殺害）は機体に入っていない。</desc>
<rect x="0" y="0" width="400" height="512" rx="8" fill="#0e131e" stroke="none"/>
<text x="14" y="24" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">人物</text>
<text x="386" y="24" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="end">入っている先</text>
<rect x="8" y="37" width="4" height="17" rx="2" fill="#fca5a5"/><text x="20" y="50" font-size="13.5" fill="#fca5a5" font-weight="700" text-anchor="start">機体の中に入れられた</text>
<rect x="8" y="62" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="89.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">スーザン・ウッディングス</text><line x1="218" y1="84" x2="239" y2="84" stroke="#fca5a5" stroke-width="2"/><polygon points="246,84 237,79 237,89" fill="#fca5a5"/><rect x="250" y="69" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="89.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">バニー</text>
<rect x="8" y="112" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="139.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">チャールズ・ブルック</text><line x1="218" y1="134" x2="239" y2="134" stroke="#fca5a5" stroke-width="2"/><polygon points="246,134 237,129 237,139" fill="#fca5a5"/><rect x="250" y="119" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="318" y="139.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">ブーズー</text>
<rect x="8" y="162" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="189.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">ローズマリー・ウォルテン</text><line x1="218" y1="184" x2="239" y2="184" stroke="#fca5a5" stroke-width="2"/><polygon points="246,184 237,179 237,189" fill="#fca5a5"/><rect x="250" y="169" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="189.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">シャ</text>
<rect x="8" y="212" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="239.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">アシュリー・パークス</text><line x1="218" y1="234" x2="239" y2="234" stroke="#fca5a5" stroke-width="2"/><polygon points="246,234 237,229 237,239" fill="#fca5a5"/><rect x="250" y="219" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="239.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">ビリー</text>
<line x1="20" y1="273" x2="46" y2="273" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="54" y="277.5" font-size="13" fill="#aeb7c8" font-weight="400" text-anchor="start">点線：示唆・Wikiの整理</text>
<rect x="8" y="295" width="4" height="17" rx="2" fill="#c9a4ff"/><text x="20" y="308" font-size="13.5" fill="#c9a4ff" font-weight="700" text-anchor="start">宿っている・憑依している</text>
<rect x="8" y="320" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="347.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">エド＆モリー・ウォルテン</text><line x1="218" y1="342" x2="239" y2="342" stroke="#c9a4ff" stroke-width="2"/><polygon points="246,342 237,337 237,347" fill="#c9a4ff"/><rect x="250" y="327" width="136" height="30" rx="15" fill="#0e131e" stroke="#c9a4ff" stroke-width="1.5"/><text x="318" y="347.5" font-size="15" fill="#c9a4ff" font-weight="700" text-anchor="middle">Rocket（人形）</text>
<rect x="8" y="370" width="384" height="44" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="397.5" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">「Bon」（灰色の存在）</text><line x1="218" y1="392" x2="239" y2="392" stroke="#c9a4ff" stroke-width="2"/><polygon points="246,392 237,387 237,397" fill="#c9a4ff"/><rect x="250" y="377" width="136" height="30" rx="15" fill="#0e131e" stroke="#c9a4ff" stroke-width="1.5"/><text x="318" y="397.5" font-size="15" fill="#c9a4ff" font-weight="700" text-anchor="middle">ボン（機体）</text>
<rect x="8" y="431" width="4" height="17" rx="2" fill="#aeb7c8"/><text x="20" y="444" font-size="13.5" fill="#aeb7c8" font-weight="700" text-anchor="start">機体に入っていない</text>
<rect x="8" y="456" width="188" height="44" rx="6" fill="none" stroke="#30384a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="483.5" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="start">ジャック</text>
<text x="184" y="483" font-size="13.5" fill="#fca5a5" font-weight="400" text-anchor="end">失踪</text>
<rect x="204" y="456" width="188" height="44" rx="6" fill="none" stroke="#30384a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="216" y="483.5" font-size="15" fill="#e8edf7" font-weight="700" text-anchor="start">ブライアン</text>
<text x="380" y="483" font-size="13.5" fill="#fca5a5" font-weight="400" text-anchor="end">殺害</text>
</svg>
