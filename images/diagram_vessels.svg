<svg xmlns="http://www.w3.org/2000/svg" width="400" height="660" viewBox="0 0 400 660" role="img" font-family="'Yu Gothic UI','Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif">
<title>誰がどの機体・人形に入っているか</title>
<desc>スーザンはバニー、チャールズはブーズー（Wikiの整理）、ローズマリーはシャ、アシュリーはビリーに入れられた。エドとモリーの魂は人形Rocketに宿り、正体不明の霊「Bon」は機体ボンに憑依している。ジャックは失踪、ブライアンは殺害されたが、機体には入っていない。</desc>
<rect x="0" y="0" width="400" height="660" rx="8" fill="#0e131e" stroke="none" stroke-width="1"/>
<text x="14" y="24" font-size="12.5" fill="#aeb7c8" font-weight="400" text-anchor="start">人物</text>
<text x="386" y="24" font-size="12.5" fill="#aeb7c8" font-weight="400" text-anchor="end">入っている先</text>
<rect x="8" y="37" width="4" height="17" rx="2" fill="#fca5a5" stroke="none" stroke-width="1"/><text x="20" y="50" font-size="13.5" fill="#fca5a5" font-weight="700" text-anchor="start">襲われ、機体の中に入れられた</text>
<rect x="8" y="62" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="90" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">スーザン・ウッディングス</text><line x1="218" y1="84" x2="239" y2="84" stroke="#fca5a5" stroke-width="2"/><polygon points="246,84 237,79 237,89" fill="#fca5a5"/><rect x="250" y="69" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="89.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">バニー</text><text x="20" y="116" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年6月30日 店舗の舞台裏で襲われ、数日後に死亡</text>
<rect x="8" y="138" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="166" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">チャールズ・ブルック</text><line x1="218" y1="160" x2="239" y2="160" stroke="#fca5a5" stroke-width="2"/><polygon points="246,160 237,155 237,165" fill="#fca5a5"/><rect x="250" y="145" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="318" y="165.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">ブーズー</text><text x="20" y="192" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">失踪。ブーズーに入れられたとするのはWikiの整理</text>
<rect x="8" y="214" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="242" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">ローズマリー・ウォルテン</text><line x1="218" y1="236" x2="239" y2="236" stroke="#fca5a5" stroke-width="2"/><polygon points="246,236 237,231 237,241" fill="#fca5a5"/><rect x="250" y="221" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="241.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">シャ</text><text x="20" y="268" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年7月19日夜 店舗の舞台裏で殺害される</text>
<rect x="8" y="290" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="318" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">アシュリー・パークス</text><line x1="218" y1="312" x2="239" y2="312" stroke="#fca5a5" stroke-width="2"/><polygon points="246,312 237,307 237,317" fill="#fca5a5"/><rect x="250" y="297" width="136" height="30" rx="15" fill="#0e131e" stroke="#fca5a5" stroke-width="1.5"/><text x="318" y="317.5" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="middle">ビリー</text><text x="20" y="344" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1978年7月14日夜 K-9施設のバックドアで殺害される</text>
<rect x="8" y="375" width="4" height="17" rx="2" fill="#c9a4ff" stroke="none" stroke-width="1"/><text x="20" y="388" font-size="13.5" fill="#c9a4ff" font-weight="700" text-anchor="start">殺されて入れられたのではなく、宿っている</text>
<rect x="8" y="400" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="428" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">エド＆モリー・ウォルテン</text><line x1="218" y1="422" x2="239" y2="422" stroke="#c9a4ff" stroke-width="2"/><polygon points="246,422 237,417 237,427" fill="#c9a4ff"/><rect x="250" y="407" width="136" height="30" rx="15" fill="#0e131e" stroke="#c9a4ff" stroke-width="1.5"/><text x="318" y="427.5" font-size="15" fill="#c9a4ff" font-weight="700" text-anchor="middle">Rocket（人形）</text><text x="20" y="454" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年5月2日の事故で死亡し、魂が人形に宿る</text>
<rect x="8" y="476" width="384" height="68" rx="6" fill="#151922" stroke="#30384a" stroke-width="1"/><text x="20" y="504" font-size="16" fill="#e8edf7" font-weight="700" text-anchor="start">「Bon」（灰色の存在）</text><line x1="218" y1="498" x2="239" y2="498" stroke="#c9a4ff" stroke-width="2"/><polygon points="246,498 237,493 237,503" fill="#c9a4ff"/><rect x="250" y="483" width="136" height="30" rx="15" fill="#0e131e" stroke="#c9a4ff" stroke-width="1.5"/><text x="318" y="503.5" font-size="15" fill="#c9a4ff" font-weight="700" text-anchor="middle">ボン（機体）</text><text x="20" y="530" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">正体不明の霊。機体に憑依して人を襲う</text>
<rect x="8" y="561" width="4" height="17" rx="2" fill="#aeb7c8" stroke="none" stroke-width="1"/><text x="20" y="574" font-size="13.5" fill="#aeb7c8" font-weight="700" text-anchor="start">機体に入っていない人物</text>
<rect x="8" y="586" width="384" height="62" rx="6" fill="none" stroke="#30384a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="611" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">ジャック</text>
<text x="104" y="611" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1974年6月11日に失踪（行方不明）</text>
<text x="20" y="634" font-size="14.5" fill="#e8edf7" font-weight="700" text-anchor="start">ブライアン</text>
<text x="104" y="634" font-size="14" fill="#aeb7c8" font-weight="400" text-anchor="start">1982年10月10日 K-9近くの森で殺害される</text>
</svg>
